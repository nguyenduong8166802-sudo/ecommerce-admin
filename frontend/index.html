
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYRO V31 REALTIME</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="logo">VYRO QUANT ENGINE V31</div>
  <div class="symbols">
    <button onclick="setSymbol('XAUUSD')">XAUUSD</button>
    <button onclick="setSymbol('BTCUSD')">BTCUSD</button>
    <button onclick="setSymbol('SPX500')">SPX500</button>
    <button onclick="setSymbol('XAGUSD')">XAGUSD</button>
  </div>
</div>

<div class="chart-panel">
  <canvas id="chart" width="1400" height="450"></canvas>
</div>

<div class="metrics">
  <div class="card"><h3>SMN</h3><div id="smn">0</div></div>
  <div class="card"><h3>POWER</h3><div id="power">0</div></div>
  <div class="card"><h3>DELTA</h3><div id="delta">0</div></div>
  <div class="card"><h3>RSI</h3><div id="rsi">0</div></div>
  <div class="card"><h3>ATR</h3><div id="atr">0</div></div>
  <div class="card"><h3>PHASE</h3><div id="phase">RANGING</div></div>
  <div class="card"><h3>GRADE</h3><div id="grade">A</div></div>
</div>

<div class="trade-panel">
  <button class="buy">BUY</button>
  <button class="sell">SELL</button>
</div>

<script src="app.js"></script>
</body>
</html>
